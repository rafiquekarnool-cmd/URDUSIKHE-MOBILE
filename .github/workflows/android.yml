name: Build UrduSikhe APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x "UrduSikhe_APK_Build_READY_FIXED (1)/gradlew"

      - name: Build APK
        working-directory: "UrduSikhe_APK_Build_READY_FIXED (1)"
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduSikhe-APK
          path: "UrduSikhe_APK_Build_READY_FIXED (1)/app/build/outputs/apk/debug/*.apk"
