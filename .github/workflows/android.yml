name: Build Android APK and Play Store AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare launcher icon
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          base64 --decode "app_icon.webp.b64" > "$PROJECT_DIR/app/src/main/res/drawable-nodpi/app_icon.webp"

      - name: Prepare release signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Release signing key loaded securely."
          else
            echo "Signing secrets are not configured; AAB will be unsigned."
          fi

      - name: Build Debug APK and Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug bundleRelease --stacktrace --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduSikhe-Test-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: UrduSikhe-PlayStore-AAB
          path: "**/app/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
